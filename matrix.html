<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>矩阵 · 空间变换可视化</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%234f46e5'/%3E%3Ctext x='32' y='44' font-size='26' text-anchor='middle' fill='white' font-family='serif' font-style='italic'%3EA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f1115; color: #e5e7eb; }
  body { display: flex; }

  .stage { position: relative; flex: 1; min-width: 0; }
  .stage canvas { position: absolute; inset: 0; display: block; }
  .stage-label {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    padding: 6px 14px; border-radius: 8px; background: rgba(20,22,28,0.85);
    font-size: 13px; font-weight: 600; color: #e5e7eb; z-index: 5;
    pointer-events: none; white-space: nowrap;
  }
  .stage-label small { display: block; font-size: 11px; font-weight: 400; color: #9ca3af; margin-top: 2px; }

  .divider { width: 1px; background: #2d323b; }

  .panel {
    width: 320px; flex-shrink: 0; padding: 16px; overflow-y: auto;
    background: rgba(20,22,28,0.95); border-left: 1px solid #2d323b;
  }
  .panel h2 { font-size: 13px; font-weight: 600; color: #e5e7eb; margin-bottom: 8px; margin-top: 14px; }
  .panel h2:first-child { margin-top: 0; }
  .latex-input {
    width: 100%; padding: 8px 10px; border: 1px solid #2d323b; border-radius: 8px;
    font-size: 12px; outline: none; background: #1a1d24; color: #e5e7eb;
    font-family: "SF Mono", Consolas, monospace;
  }
  .latex-input:focus { border-color: #6366f1; }
  .preview {
    margin-top: 8px; padding: 10px; background: #1a1d24; border-radius: 8px;
    min-height: 48px; display: flex; align-items: center; justify-content: center;
    overflow-x: auto; color: #e5e7eb;
  }
  .preview .err { color: #f87171; font-size: 12px; }
  .btns { display: flex; gap: 8px; margin-top: 14px; }
  button {
    flex: 1; padding: 9px 0; border: none; border-radius: 8px; cursor: pointer;
    font-size: 13px; font-weight: 600; transition: transform .1s;
  }
  button:active { transform: scale(0.97); }
  .btn-primary { background: #4f46e5; color: #fff; }
  .btn-primary:hover { background: #4338ca; }
  .btn-ghost { background: #2d323b; color: #d1d5db; }
  .btn-ghost:hover { background: #3a3f4a; }
  .status {
    margin-top: 12px; padding: 10px 12px; border-radius: 8px;
    background: #1a1d24; font-size: 12px; line-height: 1.6; color: #9ca3af;
    min-height: 50px;
  }
  .status b { color: #e5e7eb; }
  .legend { margin-top: 12px; font-size: 11px; color: #9ca3af; line-height: 1.9; }
  .legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

  .drawer {
    width: 56px; flex-shrink: 0; background: #15181e;
    border-right: 1px solid #2d323b; padding: 14px 8px;
    display: flex; flex-direction: column; gap: 4px;
    overflow: hidden; transition: width .2s ease;
  }
  .drawer:hover { width: 220px; }
  .drawer-logo {
    width: 36px; height: 36px; border-radius: 9px; margin: 0 auto 14px;
    background: #4f46e5; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .drawer-logo svg { width: 20px; height: 20px; }
  .drawer-title {
    font-size: 13px; font-weight: 700; color: #e5e7eb;
    padding: 0 10px 14px; letter-spacing: 0.5px; white-space: nowrap;
    opacity: 0; transition: opacity .15s ease .05s;
  }
  .drawer:hover .drawer-title { opacity: 1; }
  .drawer-link {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: 8px; white-space: nowrap;
    color: #9ca3af; text-decoration: none; font-size: 13px; transition: all .15s;
  }
  .drawer-link .ico {
    width: 18px; height: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }
  .drawer-link .txt { opacity: 0; transition: opacity .15s ease .05s; }
  .drawer:hover .drawer-link .txt { opacity: 1; }
  .drawer-link:hover { background: #1f232b; color: #e5e7eb; }
  .drawer-link.active { background: #4f46e5; color: #fff; }
  .drawer-sep { height: 1px; background: #2d323b; margin: 8px 4px; }
</style>
</head>
<body data-page="mat"><nav class="drawer">
  <div class="drawer-logo"><svg viewBox="0 0 24 24" fill="none"><path d="M5 18 L12 5 L19 18" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="drawer-title">线性代数 3D</div>
  <a href="index.html" class="drawer-link" data-page="home"><span class="ico">⌂</span><span class="txt">欢迎页</span></a>
  <div class="drawer-sep"></div>
  <a href="coordinate-system-and-vector.html" class="drawer-link" data-page="coord"><span class="ico">⊕</span><span class="txt">坐标系与向量</span></a>
  <a href="matrix.html" class="drawer-link" data-page="mat"><span class="ico">▦</span><span class="txt">矩阵空间变换</span></a>
  <a href="matrix-vector.html" class="drawer-link" data-page="mv"><span class="ico">→</span><span class="txt">矩阵 × 向量</span></a>
  <a href="matrix-matrix.html" class="drawer-link" data-page="mm"><span class="ico">⇉</span><span class="txt">矩阵 × 矩阵</span></a>
</nav>

<div class="stage" id="stageLeft">
  <div class="stage-label">变换前<small>标准基 e₁, e₂, e₃</small></div>
</div>
<div class="divider"></div>
<div class="stage" id="stageRight">
  <div class="stage-label">变换后<small>矩阵 A 的列向量 a₁, a₂, a₃</small></div>
</div>

<div class="panel">
  <h2>矩阵 A</h2>
  <input id="matrixInput" class="latex-input" type="text"
    value="\begin{bmatrix}2&amp;1&amp;0\\0&amp;1&amp;3\\0&amp;0&amp;2\end{bmatrix}" spellcheck="false">
  <div class="preview" id="matrixPreview"></div>

  <div class="btns">
    <button class="btn-primary" id="applyBtn">播放变换</button>
    <button class="btn-ghost" id="resetBtn">重置</button>
  </div>
  <div class="status" id="status">输入矩阵 A，点击「播放变换」观察右栏基向量如何形变。</div>
  <div class="legend">
    <div><span class="dot" style="background:#ef4444"></span>e₁ → a₁（第 1 列）</div>
    <div><span class="dot" style="background:#22c55e"></span>e₂ → a₂（第 2 列）</div>
    <div><span class="dot" style="background:#3b82f6"></span>e₃ → a₃（第 3 列）</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
function to3dVec(arr) {
  const x = arr[0]||0, y = arr[1]||0, z = arr[2]||0;
  return new THREE.Vector3(y, z, x);
}

function createStage(container) {
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setClearColor(0x0f1115);
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, container.clientWidth/container.clientHeight, 0.1, 200);
  camera.position.set(8, 6, 10);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(1.5, 1.5, 1.5);
  controls.minDistance = 3; controls.maxDistance = 30;
  controls.maxPolarAngle = Math.PI * 0.49;

  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const dir = new THREE.DirectionalLight(0xffffff, 0.4);
  dir.position.set(8, 15, 6);
  scene.add(dir);

  const AX = 6;
  [[1,0,0,0x555555],[0,1,0,0x555555],[0,0,1,0x555555]].forEach(([x,y,z,color]) => {
    const d = to3dVec([x,y,z]);
    scene.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), d.multiplyScalar(AX)]),
      new THREE.LineBasicMaterial({ color })
    ));
  });
  const grid = new THREE.GridHelper(AX*2, AX*2, 0x2d323b, 0x1f232b);
  grid.position.y = 0;
  scene.add(grid);

  return { scene, camera, renderer, controls, container };
}

const left = createStage(document.getElementById('stageLeft'));
const right = createStage(document.getElementById('stageRight'));

function makeArrow(color) {
  const a = new THREE.ArrowHelper(new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,0), 1, color, 0.22, 0.11);
  a.line.material.transparent = true;
  a.cone.material.transparent = true;
  return a;
}
function setArrowOpacity(arrow, label, op) {
  arrow.line.material.opacity = op;
  arrow.cone.material.opacity = op;
  if (label) label.material.opacity = op;
}
function makeLabel(text, color) {
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 128;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0,0,256,128);
  ctx.fillStyle = color;
  ctx.font = 'italic bold 80px Georgia, serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 64);
  const tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = 4;
  return new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
}

const COLORS = [0xef4444, 0x22c55e, 0x3b82f6];
const COLORS_LIGHT = ['#f87171', '#4ade80', '#60a5fa'];

const leftArrows = [makeArrow(COLORS[0]), makeArrow(COLORS[1]), makeArrow(COLORS[2])];
const leftLabels = [makeLabel('e₁',COLORS_LIGHT[0]), makeLabel('e₂',COLORS_LIGHT[1]), makeLabel('e₃',COLORS_LIGHT[2])];
leftArrows.forEach(a => left.scene.add(a));
leftLabels.forEach(l => left.scene.add(l));

const rightArrows = [makeArrow(COLORS[0]), makeArrow(COLORS[1]), makeArrow(COLORS[2])];
const rightLabels = [makeLabel('a₁',COLORS_LIGHT[0]), makeLabel('a₂',COLORS_LIGHT[1]), makeLabel('a₃',COLORS_LIGHT[2])];
rightArrows.forEach(a => right.scene.add(a));
rightLabels.forEach(l => right.scene.add(l));

function parseMatrix(str) {
  const m = (str||'').match(/\\begin\{(?:bmatrix|pmatrix|matrix|Bmatrix)\}(.+?)\\end\{/);
  if (!m) return null;
  const rows = m[1].split(/\\\\/).map(r => r.trim()).filter(Boolean);
  const mat = rows.map(row => row.split(/&/).map(s => {
    const n = parseFloat(s.trim()); return isNaN(n) ? 0 : n;
  }));
  if (!mat.length) return null;
  const ncols = mat[0].length;
  if (mat.some(r => r.length !== ncols)) return null;
  if (mat.length > 3 || ncols > 3) return null;
  return mat;
}
function colsOf(A) {
  const m = A.length, n = A[0].length;
  const cols = [];
  for (let j = 0; j < n; j++) {
    const col = [];
    for (let i = 0; i < m; i++) col.push(A[i][j]);
    cols.push(col);
  }
  return cols;
}
function pad3(arr) { return [arr[0]||0, arr[1]||0, arr[2]||0]; }

const matrixInput = document.getElementById('matrixInput');
const matrixPreview = document.getElementById('matrixPreview');
function renderPreview() {
  try { katex.render(matrixInput.value, matrixPreview, {throwOnError:true, displayMode:true}); }
  catch(e) { matrixPreview.innerHTML = '<span class="err">矩阵语法错误</span>'; }
}
matrixInput.addEventListener('input', renderPreview);
renderPreview();

const STD = [[1,0,0],[0,1,0],[0,0,1]];

function showLeftBasis(n) {
  for (let i = 0; i < 3; i++) {
    const show = i < n;
    leftArrows[i].visible = show;
    leftLabels[i].visible = show;
    if (show) {
      leftArrows[i].position.set(0,0,0);
      leftArrows[i].setDirection(to3dVec(STD[i]));
      leftArrows[i].setLength(1, 0.22, 0.11);
      leftLabels[i].position.copy(to3dVec(STD[i]).multiplyScalar(1.3));
    }
  }
}

function showRightArrows(vecs) {
  for (let i = 0; i < 3; i++) {
    const v = vecs[i];
    const show = !!v;
    rightArrows[i].visible = show;
    rightLabels[i].visible = show;
    if (show) {
      const arr = pad3(v);
      const len = Math.hypot(...arr);
      if (len > 0.001) {
        rightArrows[i].position.set(0,0,0);
        rightArrows[i].setDirection(to3dVec(arr).normalize());
        rightArrows[i].setLength(len, 0.22, 0.11);
        rightLabels[i].position.copy(to3dVec(arr).normalize().multiplyScalar(len + 0.35));
      }
    }
  }
}

function fitCamera(stage, dim) {
  if (dim === 2) { stage.camera.position.set(0.01, 9, 0.01); stage.controls.target.set(0,0,0); }
  else if (dim === 1) { stage.camera.position.set(6, 2, 0.01); stage.controls.target.set(1.5,0,0); }
  else { stage.camera.position.set(8, 6, 10); stage.controls.target.set(1.5,1.5,1.5); }
  stage.camera.lookAt(stage.controls.target);
}

const statusEl = document.getElementById('status');
let morph = null;
const MORPH_DUR = 1800;

function easeInOut(t) { return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2; }

function applyTransform() {
  if (morph) return;
  const A = parseMatrix(matrixInput.value);
  if (!A) { statusEl.innerHTML = '<b>矩阵解析失败</b><br>请输入 bmatrix 包裹的 m×n 矩阵（m,n ≤ 3）。'; return; }
  const n = A[0].length, m = A.length;
  const cols = colsOf(A);

  showLeftBasis(n);
  fitCamera(left, n);
  fitCamera(right, m);

  const starts = [to3dVec(pad3(STD[0])), to3dVec(pad3(STD[1])), to3dVec(pad3(STD[2]))];
  const ends = cols.map(c => to3dVec(pad3(c)));
  // 重置所有右箭头 opacity 为 1，多余的稍后在动画里淡出
  for (let i = 0; i < 3; i++) setArrowOpacity(rightArrows[i], rightLabels[i], 1);
  morph = { start: performance.now(), starts, ends, nCols: cols.length, size: m + '×' + n };
  statusEl.innerHTML = '<b>形变中 …</b><br>e₁ → a₁，e₂ → a₂，e₃ → a₃';
}

function resetView() {
  morph = null;
  showLeftBasis(3);
  showRightArrows([STD[0], STD[1], STD[2]]);
  for (let i = 0; i < 3; i++) {
    rightArrows[i].visible = true;
    rightLabels[i].visible = true;
    setArrowOpacity(rightArrows[i], rightLabels[i], 1);
  }
  fitCamera(left, 3); fitCamera(right, 3);
  statusEl.innerHTML = '已重置。输入矩阵后点击「播放变换」。';
}

document.getElementById('applyBtn').addEventListener('click', applyTransform);
document.getElementById('resetBtn').addEventListener('click', resetView);

showLeftBasis(3);
showRightArrows([STD[0], STD[1], STD[2]]);

function loop(now) {
  requestAnimationFrame(loop);
  left.controls.update(); right.controls.update();

  if (morph) {
    const t = Math.min(1, (now - morph.start) / MORPH_DUR);
    const e = easeInOut(t);
    for (let i = 0; i < morph.nCols; i++) {
      const cur = morph.starts[i].clone().lerp(morph.ends[i], e);
      const len = cur.length();
      if (len > 0.001) {
        rightArrows[i].visible = true;
        rightArrows[i].position.set(0,0,0);
        rightArrows[i].setDirection(cur.clone().normalize());
        rightArrows[i].setLength(len, 0.22, 0.11);
        rightLabels[i].visible = true;
        rightLabels[i].position.copy(cur.clone().normalize().multiplyScalar(len + 0.35));
        setArrowOpacity(rightArrows[i], rightLabels[i], 1);
      } else {
        rightArrows[i].visible = false;
        rightLabels[i].visible = false;
      }
    }
    // 多余的基箭头（i >= nCols）淡出
    for (let i = morph.nCols; i < 3; i++) {
      rightArrows[i].visible = true;
      rightLabels[i].visible = true;
      setArrowOpacity(rightArrows[i], rightLabels[i], 1 - e);
    }
    if (t >= 1) {
      for (let i = morph.nCols; i < 3; i++) {
        rightArrows[i].visible = false;
        rightLabels[i].visible = false;
      }
      morph = null;
      statusEl.innerHTML = '<b>变换完成</b><br>矩阵 A 是 ' + morph.size + '，基向量已形变到列向量位置。';
    }
  }

  left.renderer.render(left.scene, left.camera);
  right.renderer.render(right.scene, right.camera);
}
requestAnimationFrame(loop);

window.addEventListener('resize', () => {
  [left, right].forEach(s => {
    const w = s.container.clientWidth, h = s.container.clientHeight;
    s.camera.aspect = w/h; s.camera.updateProjectionMatrix();
    s.renderer.setSize(w, h);
  });
});
</script>
<script>
  (function(){
    var page = document.body.getAttribute('data-page');
    document.querySelectorAll('.drawer-link').forEach(function(a){
      if (a.getAttribute('data-page') === page) a.classList.add('active');
    });
  })();
</script>
</body>
</html>
