<div class="stage" id="stageLeft">
  <div class="stage-label">变换前<small>标准基 i, j, k 下的向量 v</small></div>
</div>
<div class="divider"></div>
<div class="stage" id="stageRight">
  <div class="stage-label">变换后<small>新基 A·i, A·j, A·k 下的向量 A·v</small></div>
</div>

<div class="panel">
  <h2>矩阵 A（3×3）</h2>
  <input id="matrixInput" class="latex-input" type="text"
    value="\begin{bmatrix}2&amp;1&amp;0\\0&amp;1&amp;3\\0&amp;0&amp;2\end{bmatrix}" spellcheck="false">
  <div class="preview" id="matrixPreview"></div>

  <h2>向量 v</h2>

  <div class="btns">
    <button class="btn-primary" id="applyBtn">应用变换</button>
    <button class="btn-ghost" id="resetBtn">重置</button>
  </div>
  <div class="status" id="status">输入矩阵 A 和向量 v，点击「应用变换」观察右栏空间如何形变。</div>
  <div class="legend">
    <div><span class="dot" style="background:#ef4444"></span>基向量 i（x 方向）</div>
    <div><span class="dot" style="background:#22c55e"></span>基向量 j（y 方向）</div>
    <div><span class="dot" style="background:#3b82f6"></span>基向量 k（z 方向）</div>
    <div><span class="dot" style="background:#c084fc"></span>向量 v / A·v</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ============ 通用：数学坐标 -> Three.js（右手系，Z 向上） ============
// 数学 X -> Three.js +Z（朝前），数学 Y -> Three.js +X（朝右），数学 Z -> Three.js +Y（朝上）
function to3dVec(arr) {
  const x = arr[0]||0, y = arr[1]||0, z = arr[2]||0;
  return new THREE.Vector3(y, z, x);
}
function to3d(x,y,z){ return to3dVec([x,y,z]); }

// ============ 创建一个 3D 场景 ============
function createStage(container) {
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setClearColor(0x0f1115);
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, container.clientWidth/container.clientHeight, 0.1, 200);
  camera.position.set(8, 6, 10);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(1.5, 1.5, 1.5);
  controls.minDistance = 3; controls.maxDistance = 30;
  controls.maxPolarAngle = Math.PI * 0.49;

  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const dir = new THREE.DirectionalLight(0xffffff, 0.4);
  dir.position.set(8, 15, 6);
  scene.add(dir);

  // 参考坐标轴（浅灰，长 6）
  const AX = 6;
  [[1,0,0,0x555555],[0,1,0,0x555555],[0,0,1,0x555555]].forEach(([x,y,z,color]) => {
    const d = to3d(x,y,z);
    scene.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), d.multiplyScalar(AX)]),
      new THREE.LineBasicMaterial({ color })
    ));
  });
  // XY 地面网格
  const grid = new THREE.GridHelper(AX*2, AX*2, 0x2d323b, 0x1f232b);
  grid.position.y = 0;
  scene.add(grid);

  return { scene, camera, renderer, controls, container };
}

const left = createStage(document.getElementById('stageLeft'));
const right = createStage(document.getElementById('stageRight'));

// ============ 画箭头 / 标签工具 ============
function setArrow(arrow, dirArr, length) {
  const d = to3dVec(dirArr).normalize();
  arrow.position.set(0,0,0);
  arrow.setDirection(d);
  arrow.setLength(Math.max(length, 0.001), 0.18, 0.08);
}
function makeArrow(color) {
  return new THREE.ArrowHelper(new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,0), 1, color, 0.18, 0.08);
}
function makeLabel(text, color) {
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 128;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0,0,256,128);
  ctx.fillStyle = color;
  ctx.font = 'italic bold 80px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 64);
  const tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = 4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sp.scale.set(0.55, 0.28, 1);
  return sp;
}

// 左面板：标准基 i/j/k（前 n 个）+ 紫色 v
const leftArrows = { i: makeArrow(0xef4444), j: makeArrow(0x22c55e), k: makeArrow(0x3b82f6), v: makeArrow(0xc084fc) };
Object.values(leftArrows).forEach(a => left.scene.add(a));
const leftLabels = [makeLabel('i','#f87171'), makeLabel('j','#4ade80'), makeLabel('k','#60a5fa')];
leftLabels.forEach(l => left.scene.add(l));

// 右面板：变换后的基箭头（矩阵列向量）+ 小球 + 路径 + 紫色合成向量
const rightArrows = { i: makeArrow(0xef4444), j: makeArrow(0x22c55e), k: makeArrow(0x3b82f6) };
Object.values(rightArrows).forEach(a => right.scene.add(a));
const rightLabels = [makeLabel("î","#f87171"), makeLabel("ĵ","#4ade80"), makeLabel("k̂","#60a5fa")];
rightLabels.forEach(l => right.scene.add(l));

const rightBall = new THREE.Mesh(
  new THREE.SphereGeometry(0.09, 20, 20),
  new THREE.MeshStandardMaterial({ color: 0x111827, emissive: 0xc084fc, emissiveIntensity: 0.6, roughness: 0.3 })
);
right.scene.add(rightBall);
rightBall.position.copy(to3d(0,0,0));

const rightPathGroup = new THREE.Group();
right.scene.add(rightPathGroup);
let rightPurpleArrow = null;

// ============ 解析 ============
function parseMatrix(str) {
  const m = (str||'').match(/\\begin\{(?:bmatrix|pmatrix|matrix|Bmatrix)\}(.+?)\\end\{/);
  if (!m) return null;
  const rows = m[1].split(/\\\\/).map(r => r.trim()).filter(Boolean);
  const mat = rows.map(row => row.split(/&/).map(s => {
    const n = parseFloat(s.trim());
    return isNaN(n) ? 0 : n;
  }));
  if (mat.length === 0) return null;
  const ncols = mat[0].length;
  if (mat.some(r => r.length !== ncols)) return null;
  if (mat.length > 3 || ncols > 3) return null; // MVP 只支持 ≤3 维
  return mat; // m×n 数组，m,n ≤ 3
}

function parseVector(str) {
  let s = (str||'').trim();
  if (!s) return [];
  s = s.replace(/\\?vec\{?[a-zA-Z]\}?\s*=\s*/, '').replace(/^[a-zA-Z]\s*=\s*/, '');
  const bracket = s.match(/[\(\[\<]([^\)\]\>]+)[\)\]\>]/);
  if (bracket) {
    return bracket[1].split(/[,，;；]/).map(p => parseFloat(p.trim())).filter(n => !isNaN(n));
  }
  const matrix = s.match(/\\begin\{(?:bmatrix|pmatrix|matrix)\}(.+?)\\end\{/);
  if (matrix) {
    const rows = matrix[1].split(/\\\\/).map(r => r.trim()).filter(Boolean);
    return rows.map(r => parseFloat(r.trim())).filter(n => !isNaN(n));
  }
  return [];
}

function matVec(A, v) {
  const m = A.length, n = A[0].length;
  if (v.length !== n) return null; // 维度不匹配
  return A.map(row => row.reduce((s, a, j) => s + a*v[j], 0));
}
function colsOf(A) {
  const m = A.length, n = A[0].length;
  const cols = [];
  for (let j = 0; j < n; j++) {
    const col = [];
    for (let i = 0; i < m; i++) col.push(A[i][j]);
    cols.push(col);
  }
  return cols;
}
function pad3(arr) {
  return [arr[0]||0, arr[1]||0, arr[2]||0];
}

// ============ KaTeX 预览 ============
const matrixInput = document.getElementById('matrixInput');
const vectorInput = document.getElementById('vectorInput');
const matrixPreview = document.getElementById('matrixPreview');
const vectorPreview = document.getElementById('vectorPreview');
function renderPreviews() {
  try { katex.render(matrixInput.value, matrixPreview, {throwOnError:true, displayMode:true}); }
  catch(e) { matrixPreview.innerHTML = '<span class="err">矩阵语法错误</span>'; }
  try { katex.render(vectorInput.value, vectorPreview, {throwOnError:true, displayMode:true}); }
  catch(e) { vectorPreview.innerHTML = '<span class="err">向量语法错误</span>'; }
}
matrixInput.addEventListener('input', renderPreviews);
vectorInput.addEventListener('input', renderPreviews);
renderPreviews();

// ============ 渲染当前状态 ============
const STD_BASIS = [[1,0,0],[0,1,0],[0,0,1]];
const STD_COLORS = [0xef4444, 0x22c55e, 0x3b82f6];
const BASIS_NAMES = ["î","ĵ","k̂"];

function drawLeft(v) {
  const n = v.length;
  ['i','j','k'].forEach((name, idx) => {
    const show = idx < n;
    leftArrows[name].visible = show;
    leftLabels[idx].visible = show;
    if (show) {
      setArrow(leftArrows[name], STD_BASIS[idx], 1);
      leftLabels[idx].position.copy(to3dVec(STD_BASIS[idx]).multiplyScalar(1.25));
    }
  });
  const len = Math.hypot(...v);
  leftArrows.v.visible = len > 0.001;
  if (len > 0.001) setArrow(leftArrows.v, pad3(v), len);
}

function setRightBasis(cols) {
  ['i','j','k'].forEach((name, idx) => {
    const c = cols[idx];
    const show = !!c;
    rightArrows[name].visible = show;
    rightLabels[idx].visible = show;
    if (show) {
      const len = Math.hypot(...c);
      setArrow(rightArrows[name], c, len);
      rightLabels[idx].position.copy(to3dVec(c).normalize().multiplyScalar(len + 0.3));
    }
  });
}

function clearRightPath() {
  while (rightPathGroup.children.length) {
    const c = rightPathGroup.children.pop();
    c.geometry.dispose(); c.material.dispose();
  }
  if (rightPurpleArrow) { right.scene.remove(rightPurpleArrow); rightPurpleArrow = null; }
}

function addRightSeg(a, b, t, color) {
  const cur = a.clone().lerp(b, t);
  rightPathGroup.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([a, cur]),
    new THREE.LineBasicMaterial({ color })
  ));
}
function easeInOut(t) { return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2; }

function fitCamera(stage, dim) {
  if (dim === 2) {
    stage.camera.position.set(0.01, 9, 0.01);
    stage.controls.target.set(0, 0, 0);
  } else if (dim === 1) {
    stage.camera.position.set(6, 2, 0.01);
    stage.controls.target.set(1.5, 0, 0);
  } else {
    stage.camera.position.set(8, 6, 10);
    stage.controls.target.set(1.5, 1.5, 1.5);
  }
  stage.camera.lookAt(stage.controls.target);
}

// ============ 动画控制 ============
const statusEl = document.getElementById('status');
let anim = null;
const SEG_DUR = 900;

function applyTransform() {
  if (anim) return;
  const A = parseMatrix(matrixInput.value);
  const v = parseVector(vectorInput.value);
  if (!A) { statusEl.innerHTML = '<b>矩阵解析失败</b><br>请输入 bmatrix 包裹的 m×n 矩阵（m,n ≤ 3）。'; return; }
  const n = A[0].length, m = A.length;
  if (v.length === 0) { statusEl.innerHTML = '<b>向量为空</b>'; return; }
  if (v.length !== n) {
    statusEl.innerHTML = '<b>维度不匹配</b><br>矩阵 A 是 ' + m + '×' + n + '，需要 ' + n + ' 维向量；当前输入是 ' + v.length + ' 维。';
    return;
  }
  if (v.every(x => x === 0)) { statusEl.innerHTML = '<b>零向量</b>'; return; }

  drawLeft(v);
  fitCamera(left, n);
  fitCamera(right, m);
  clearRightPath();

  const cols = colsOf(A);
  setRightBasis(cols);

  let curPt = to3d(0,0,0);
  const Pts = [curPt.clone()];
  cols.forEach((c, j) => {
    curPt = curPt.clone().add(to3dVec(c.map(x => x * v[j])));
    Pts.push(curPt.clone());
  });

  const segs = [];
  for (let j = 0; j < n; j++) {
    if (v[j] !== 0) segs.push({ from: Pts[j], to: Pts[j+1], color: STD_COLORS[j], axis: BASIS_NAMES[j], value: v[j] });
  }
  anim = { start: performance.now(), segs, P3: Pts[n], Av: matVec(A, v) };
  statusEl.innerHTML = '<b>阶段 1 / ' + segs.length + '</b><br>从 O 沿新基 ' + segs[0].axis + ' 走 <b>' + segs[0].value + '</b> 个单位 …';
}

function resetView() {
  anim = null;
  const v = parseVector(vectorInput.value);
  drawLeft(v);
  setRightBasis(STD_BASIS);
  clearRightPath();
  rightBall.position.copy(to3d(0,0,0));
  fitCamera(left, v.length || 3);
  fitCamera(right, 3);
  statusEl.innerHTML = '已重置。点击「应用变换」重新演示。';
}

document.getElementById('applyBtn').addEventListener('click', applyTransform);
document.getElementById('resetBtn').addEventListener('click', resetView);

// 初始绘制
drawLeft([2,1,1]);
setRightBasis(STD_BASIS);

// ============ 渲染循环 ============
function loop(now) {
  requestAnimationFrame(loop);
  left.controls.update();
  right.controls.update();

  if (anim) {
    const { segs, P3, Av } = anim;
    const total = segs.length;
    const elapsed = now - anim.start;
    const seg = Math.floor(elapsed / SEG_DUR);
    let t = Math.min(1, Math.max(0, (elapsed % SEG_DUR) / SEG_DUR));
    t = easeInOut(t);

    while (rightPathGroup.children.length) {
      const c = rightPathGroup.children.pop();
      c.geometry.dispose(); c.material.dispose();
    }

    if (seg < total) {
      const s = segs[seg];
      const cur = s.from.clone().lerp(s.to, t);
      for (let i = 0; i < seg; i++) addRightSeg(segs[i].from, segs[i].to, 1, segs[i].color);
      addRightSeg(s.from, s.to, t, s.color);
      statusEl.innerHTML = '<b>阶段 ' + (seg+1) + ' / ' + total + '</b><br>沿新基 <b>' + s.axis + '</b> 走 <b>' + s.value + '</b> 个单位 …';
      rightBall.position.copy(cur);
    } else {
      for (let i = 0; i < total; i++) addRightSeg(segs[i].from, segs[i].to, 1, segs[i].color);
      if (P3.length() > 0.01) {
        const origin = new THREE.Vector3(0,0,0);
        const fullLen = P3.length();
        const dir = P3.clone().sub(origin).normalize();
        rightPurpleArrow = new THREE.ArrowHelper(dir, origin, fullLen, 0xc084fc, 0.25, 0.12);
        right.scene.add(rightPurpleArrow);
      }
      statusEl.innerHTML = '<b>变换完成</b><br>A·v = (' + Av.map(x=>+x.toFixed(2)).join(', ') + ')'
        + '<br>映射到 R^' + Av.length;
      anim = null;
    }
  }

  left.renderer.render(left.scene, left.camera);
  right.renderer.render(right.scene, right.camera);
}
requestAnimationFrame(loop);

window.addEventListener('resize', () => {
  [left, right].forEach(s => {
    const w = s.container.clientWidth, h = s.container.clientHeight;
    s.camera.aspect = w/h; s.camera.updateProjectionMatrix();
    s.renderer.setSize(w, h);
  });
});
</script>
<script>
  // highlight current page in drawer
  (function(){
    var page = document.body.getAttribute('data-page');
    if (!page) return;
    document.querySelectorAll('.drawer-link').forEach(function(a){
      if (a.getAttribute('data-page') === page) a.classList.add('active');
    });
  })();
</script>
</body>
</html>
