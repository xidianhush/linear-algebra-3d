<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script>
// ============ 通用：数学坐标 -> Three.js（右手系，Z 向上） ============
// 数学 X -> Three.js +Z（朝前），数学 Y -> Three.js +X（朝右），数学 Z -> Three.js +Y（朝上）
function to3dVec(arr) {
  const x = arr[0]||0, y = arr[1]||0, z = arr[2]||0;
  return new THREE.Vector3(y, z, x);
}
function to3d(x,y,z){ return to3dVec([x,y,z]); }

// ============ 创建一个 3D 场景 ============
function createStage(container) {
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setClearColor(0x0f1115);
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, container.clientWidth/container.clientHeight, 0.1, 200);
  camera.position.set(8, 6, 10);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(1.5, 1.5, 1.5);
  controls.minDistance = 3; controls.maxDistance = 30;
  controls.maxPolarAngle = Math.PI * 0.49;

  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const dir = new THREE.DirectionalLight(0xffffff, 0.4);
  dir.position.set(8, 15, 6);
  scene.add(dir);

  // 参考坐标轴（浅灰，长 6）
  const AX = 6;
  [[1,0,0,0x555555],[0,1,0,0x555555],[0,0,1,0x555555]].forEach(([x,y,z,color]) => {
    const d = to3d(x,y,z);
    scene.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), d.multiplyScalar(AX)]),
      new THREE.LineBasicMaterial({ color })
    ));
  });
  // XY 地面网格
  const grid = new THREE.GridHelper(AX*2, AX*2, 0x2d323b, 0x1f232b);
  grid.position.y = 0;
  scene.add(grid);

  return { scene, camera, renderer, controls, container };
}

const left = createStage(document.getElementById('stageLeft'));
const right = createStage(document.getElementById('stageRight'));

// ============ 画箭头 / 标签工具 ============
function setArrow(arrow, dirArr, length) {
  const d = to3dVec(dirArr).normalize();
  arrow.position.set(0,0,0);
  arrow.setDirection(d);
  arrow.setLength(Math.max(length, 0.001), 0.18, 0.08);
}
function makeArrow(color) {
  return new THREE.ArrowHelper(new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,0), 1, color, 0.18, 0.08);
}
function makeSprite(text, color, opts) {
  opts = opts || {};
  const bold = opts.bold !== false;
  const px = opts.px || 64;
  // 按文本长度估算宽度
  const cv = document.createElement('canvas');
  const padX = 16, padY = 8;
  cv.height = 96;
  cv.width = Math.max(96, text.length * px * 0.72 + padX * 2);
  const ctx = cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle = color;
  ctx.font = (bold?'bold ':'') + px + 'px "Segoe UI","Microsoft YaHei",Georgia,serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, cv.width/2, cv.height/2);
  const tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = 4;
  const w = cv.width / cv.height;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sp.scale.set(1.1 * w, 1.1, 1);
  return sp;
}
function makeLabel(text, color) {
  return makeSprite(text, color, { px: 80 });
}

// 左面板：标准基 i/j/k（前 n 个）+ 紫色 v
const leftArrows = { i: makeArrow(0xef4444), j: makeArrow(0x22c55e), k: makeArrow(0x3b82f6), v: makeArrow(0xc084fc) };
Object.values(leftArrows).forEach(a => left.scene.add(a));
const leftLabels = [makeLabel('i','#f87171'), makeLabel('j','#4ade80'), makeLabel('k','#60a5fa')];
leftLabels.forEach(l => left.scene.add(l));

// 右面板：变换后的基箭头（矩阵列向量）+ 小球 + 路径 + 紫色合成向量
const rightArrows = { i: makeArrow(0xef4444), j: makeArrow(0x22c55e), k: makeArrow(0x3b82f6) };
Object.values(rightArrows).forEach(a => right.scene.add(a));
const rightLabels = [makeLabel("î","#f87171"), makeLabel("ĵ","#4ade80"), makeLabel("k̂","#60a5fa")];
rightLabels.forEach(l => right.scene.add(l));

const rightBall = new THREE.Mesh(
  new THREE.SphereGeometry(0.09, 20, 20),
  new THREE.MeshStandardMaterial({ color: 0x111827, emissive: 0xc084fc, emissiveIntensity: 0.6, roughness: 0.3 })
);
right.scene.add(rightBall);
rightBall.position.copy(to3d(0,0,0));

const rightPathGroup = new THREE.Group();
right.scene.add(rightPathGroup);
let rightPurpleArrow = null;

// ============ 量纲引擎（量纲模式） ============
// 量纲指数向量顺序: [kg, m, s, A, K, mol, cd]
const DIM_ZERO = [0,0,0,0,0,0,0];
const DIM_UNIT = {
  'kg':[1,0,0,0,0,0,0], 'g':[-3,0,0,0,0,0,0],
  'm':[0,1,0,0,0,0,0], 'cm':[0,1,0,0,0,0,0], 'mm':[0,1,0,0,0,0,0], 'km':[0,1,0,0,0,0,0],
  's':[0,0,1,0,0,0,0], 'min':[0,0,1,0,0,0,0], 'h':[0,0,1,0,0,0,0],
  'A':[0,0,0,1,0,0,0], 'K':[0,0,0,0,1,0,0], 'mol':[0,0,0,0,0,1,0], 'cd':[0,0,0,0,0,0,1],
  'Hz':[0,0,-1,0,0,0,0],
  'N':[1,1,-2,0,0,0,0],
  'Pa':[-1,1,-2,0,0,0,0],
  'J':[2,1,-2,0,0,0,0],
  'W':[2,1,-3,0,0,0,0],
  'C':[0,0,1,1,0,0,0],
  'V':[2,1,-3,-1,0,0,0],
  'F':[-2,-1,4,2,0,0,0],
  'Ω':[2,1,-3,-2,0,0,0], 'ohm':[2,1,-3,-2,0,0,0],
  'S':[-2,-1,3,2,0,0,0],
  'Wb':[2,1,-2,-1,0,0,0],
  'T':[0,1,-2,-1,0,0,0],
  'H':[2,1,-2,-2,0,0,0],
  'L':[3,0,0,0,0,0,0],
  'rad':[0,0,0,0,0,0,0]
};
const DIM_SUP = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
const DIM_SUP_MAP = {'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁻':'-'};
function dimAdd(a,b){ return a.map((x,i)=>x+(b[i]||0)); }
function dimSub(a,b){ return a.map((x,i)=>x-(b[i]||0)); }
function dimMul(a,n){ return a.map(x=>x*n); }
function dimEq(a,b){ return a.every((x,i)=>x===b[i]); }
function unitTerm(name){
  name = name.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]/g, c=>DIM_SUP_MAP[c]||c);
  const m = name.match(/^([A-Za-z]+)\s*\^?\s*([-]?\d+)?$/);
  let base=name, power=1;
  if (m){ base=m[1]; if(m[2]!==undefined) power=parseInt(m[2],10); }
  const d = DIM_UNIT[base];
  if(!d) return null;
  return dimMul(d, power);
}
function parseUnit(str){
  if(!str) return DIM_ZERO.slice();
  str = String(str).trim();
  str = str.replace(/\\text\s*\{([^}]*)\}/g,'$1').replace(/\\mathrm\s*\{([^}]*)\}/g,'$1');
  // LaTeX 希腊字母/单位命令 -> 字符
  str = str.replace(/\\Omega/g,'Ω').replace(/\\ohm/g,'Ω')
           .replace(/\\mu\b/g,'µ').replace(/\\mu\s*/g,'µ')
           .replace(/\\Delta/g,'').replace(/\\degree/g,'°');
  str = str.replace(/\s+/g,'·');
  str = str.replace(/[·×*]/g,'·');
  str = str.replace(/\^([-]?\d+)/g,'$1');
  let pos=0;
  function isU(c){ return /[A-Za-zΩ]/.test(c); }
  function factor(){
    if(str[pos]==='('){ pos++; const v=sum(); if(str[pos]===')') pos++; return v; }
    let name='';
    while(pos<str.length && (isU(str[pos]) || /[⁰¹²³⁴⁵⁶⁷⁸⁹⁻-]/.test(str[pos]) || /\d/.test(str[pos]))){ name+=str[pos]; pos++; }
    return unitTerm(name);
  }
  function sum(){
    let v=factor(); if(v===null) return null;
    while(pos<str.length){
      if(str[pos]==='·' || str[pos]==='/'){
        const op=str[pos]; pos++;
        const w=factor(); if(w===null) return null;
        v = op==='·'? dimAdd(v,w) : dimSub(v,w);
      } else break;
    }
    return v;
  }
  return sum();
}
function dimExpSup(e){
  if(e===1) return '';
  const neg=e<0;
  const a=String(Math.abs(e)).split('').map(c=>DIM_SUP[c]||c).join('');
  return (neg?'⁻':'')+a;
}
function dimToString(d){
  const names=['kg','m','s','A','K','mol','cd'];
  const parts=[];
  for(let i=0;i<d.length;i++){
    const e=d[i]; if(e===0) continue;
    let s=names[i];
    if(e!==1) s+=dimExpSup(e);
    parts.push(s);
  }
  return parts.join('·');
}
function parseQty(str){
  let s=String(str||'').trim();
  if(!s) return {num:0, dim:DIM_ZERO.slice()};
  let unitPart='';
  const tm=s.match(/\\text\s*\{([^}]*)\}/);
  if(tm){ unitPart=tm[1].trim(); s=s.replace(/\\text\s*\{[^}]*\}/,''); }
  s=s.replace(/\\[,;:! ]/g,'');
  const nm=s.match(/[-+]?\d*\.?\d+(?:[eE][-+]?\d+)?/);
  let num=1, rest='';
  if(nm){ num=parseFloat(nm[0]); rest=s.slice(nm.index+nm[0].length); }
  else rest=s;
  const unitStr=(unitPart||rest).trim();
  const dim=parseUnit(unitStr)||DIM_ZERO.slice();
  return {num, dim};
}

// ============ 解析 ============
// 解析矩阵：量纲模式下返回 {num:[][], dim:[][][]}
function parseMatrix(str) {
  const m = (str||'').match(/\\begin\{(?:bmatrix|pmatrix|matrix|Bmatrix)\}(.+?)\\end\{/);
  if (!m) return null;
  const rows = m[1].split(/\\\\/).map(r => r.trim()).filter(Boolean);
  const mat = rows.map(row => row.split(/&/).map(s => {
    if (dimMode) {
      const q = parseQty(s.trim());
      return q;
    }
    const n = parseFloat(s.trim());
    return isNaN(n) ? 0 : n;
  }));
  if (mat.length === 0) return null;
  const ncols = mat[0].length;
  if (mat.some(r => r.length !== ncols)) return null;
  if (mat.length > 3 || ncols > 3) return null; // MVP 只支持 ≤3 维
  return mat;
}

function parseVector(str) {
  let s = (str||'').trim();
  if (!s) return [];
  s = s.replace(/\\?vec\{?[a-zA-Z]\}?\s*=\s*/, '').replace(/^[a-zA-Z]\s*=\s*/, '');
  // 先清除 LaTeX 间距命令，避免 \, 里的逗号被当成分隔符
  s = s.replace(/\\[,;:! ]/g, ' ');
  const bracket = s.match(/[\(\[\<]([^\)\]\>]+)[\)\]\>]/);
  if (bracket) {
    return bracket[1].split(/[,，;；]/).map(p => {
      const t = p.trim(); if (!t) return null;
      return dimMode ? parseQty(t) : (isNaN(parseFloat(t)) ? 0 : parseFloat(t));
    }).filter(n => n !== null);
  }
  const matrix = s.match(/\\begin\{(?:bmatrix|pmatrix|matrix)\}(.+?)\\end\{/);
  if (matrix) {
    const rows = matrix[1].split(/\\\\/).map(r => r.trim()).filter(Boolean);
    return rows.map(r => {
      const t = r.trim(); if (!t) return null;
      return dimMode ? parseQty(t) : (isNaN(parseFloat(t)) ? 0 : parseFloat(t));
    }).filter(n => n !== null);
  }
  return [];
}

// 量纲模式下：A 元素 {num,dim}，v 元素 {num,dim}。
// 输出 y_i = Σ_j A_ij * v_j，要求每项量纲一致。
function matVec(A, v) {
  const m = A.length, n = A[0].length;
  if (v.length !== n) return null;
  if (!dimMode) return A.map(row => row.reduce((s, a, j) => s + a*v[j], 0));
  // 量纲模式：返回 {num, dim}
  const out = [];
  for (let i = 0; i < m; i++) {
    let num = 0, dimAcc = null, err = null;
    for (let j = 0; j < n; j++) {
      const a = A[i][j], vv = v[j];
      const prodNum = a.num * vv.num;
      // 0 项不贡献量纲（0·x = 0 不改变维度）
      if (Math.abs(prodNum) < 1e-12) continue;
      const itemDim = dimAdd(a.dim, vv.dim);
      if (dimAcc === null) dimAcc = itemDim;
      else if (!dimEq(dimAcc, itemDim)) { err = '分量 ' + (i+1) + ' 第 ' + (j+1) + ' 项量纲不一致'; break; }
      num += prodNum;
    }
    if (dimAcc === null) dimAcc = DIM_ZERO.slice();
    out.push(err ? { err } : { num, dim: dimAcc });
  }
  return out;
}
function colsOf(A) {
  const m = A.length, n = A[0].length;
  const cols = [];
  for (let j = 0; j < n; j++) {
    const col = [];
    for (let i = 0; i < m; i++) col.push(A[i][j]);
    cols.push(col);
  }
  return cols;
}
function pad3(arr) {
  return [arr[0]||0, arr[1]||0, arr[2]||0];
}
// 量纲模式下取数值部分（用于动画坐标）
function numOf(x){ return dimMode ? x.num : x; }
function numArrOf(arr){ return arr.map(x => dimMode ? x.num : x); }

// ============ KaTeX 预览 ============
const matrixInput = document.getElementById('matrixInput');
const vectorInput = document.getElementById('vectorInput');
const matrixPreview = document.getElementById('matrixPreview');
const vectorPreview = document.getElementById('vectorPreview');
function vecToLatex(raw) {
  raw = (raw||'').trim();
  if (!raw) return '';
  if (raw.indexOf('\\begin') === 0) return raw;
  var inner = raw.replace(/^[\[\(\{]+/, '').replace(/[\]\)\}]+$/, '');
  var parts = inner.split(/[,，;；\s]+/).filter(function(x){ return x.length>0; });
  if (!parts.length) return raw;
  return '\\begin{pmatrix}' + parts.join(' \\\\ ') + '\\end{pmatrix}';
}
function renderPreviews() {
  try { katex.render(matrixInput.value, matrixPreview, {throwOnError:true, displayMode:true}); }
  catch(e) { matrixPreview.innerHTML = '<span class="err">矩阵语法错误</span>'; }
  try { katex.render(vecToLatex(vectorInput.value), vectorPreview, {throwOnError:true, displayMode:true}); }
  catch(e) { vectorPreview.innerHTML = '<span class="err">向量语法错误</span>'; }
}
matrixInput.addEventListener('input', renderPreviews);
vectorInput.addEventListener('input', renderPreviews);
renderPreviews();

// ============ 模式（纯数字 / 量纲） ============
let dimMode = false;
const modeNumBtn = document.getElementById('modeNum');
const modeDimBtn = document.getElementById('modeDim');
function setMode(dim){
  dimMode = dim;
  modeNumBtn.classList.toggle('on', !dim);
  modeDimBtn.classList.toggle('on', dim);
  resetView();
  renderPreviews();
}
modeNumBtn.addEventListener('click', () => setMode(false));
modeDimBtn.addEventListener('click', () => setMode(true));

// ============ 渲染当前状态 ============
const STD_BASIS = [[1,0,0],[0,1,0],[0,0,1]];
const STD_COLORS = [0xef4444, 0x22c55e, 0x3b82f6];
const BASIS_NAMES = ["î","ĵ","k̂"];

// 坐标+单位标注 sprite（量纲模式下显示，标在向量尾部）
const leftCoordLabel = makeSprite('', '#c084fc', { px: 34 });
const rightCoordLabel = makeSprite('', '#c084fc', { px: 34 });
leftCoordLabel.visible = false; rightCoordLabel.visible = false;
left.scene.add(leftCoordLabel); right.scene.add(rightCoordLabel);

// 格式：每分量 数值+单位，如 "(2 m, 1 m/s, 1 s)"
function fmtCoord(v, prefix){
  const parts = v.map(q => {
    const n = (dimMode ? q.num : q);
    const d = dimMode ? dimToString(q.dim) : '';
    const ns = Math.abs(n - Math.round(n)) < 1e-9 ? String(n) : n.toFixed(2);
    return d ? (ns + ' ' + d) : ns;
  });
  return (prefix ? prefix + ' = ' : '') + '(' + parts.join(', ') + ')';
}

function drawLeft(v) {
  const n = v.length;
  // v 可能含量纲
  const vnum = dimMode ? v.map(q=>q.num) : v;
  ['i','j','k'].forEach((name, idx) => {
    const show = idx < n;
    leftArrows[name].visible = show;
    leftLabels[idx].visible = show;
    if (show) {
      setArrow(leftArrows[name], STD_BASIS[idx], 1);
      leftLabels[idx].position.copy(to3dVec(STD_BASIS[idx]).multiplyScalar(1.25));
      // 量纲模式：基向量标单位（单位取对应分量单位）
      if (dimMode) {
        const d = v[idx] ? v[idx].dim : DIM_ZERO;
        const ds = dimToString(d);
        // 用文本 sprite 重新生成标签：i·m 等
        const t = makeSprite(['i','j','k'][idx] + (ds ? '·'+ds : ''), ['#f87171','#4ade80','#60a5fa'][idx], { px: 56 });
        leftLabels[idx].material.map = t.material.map;
        leftLabels[idx].scale.copy(t.scale);
      }
    }
  });
  const len = Math.hypot(...vnum);
  leftArrows.v.visible = len > 0.001;
  if (len > 0.001) setArrow(leftArrows.v, pad3(vnum), len);
  // 坐标标注
  if (dimMode) {
    leftCoordLabel.visible = v.length > 0;
    if (v.length > 0) {
      leftCoordLabel.material.map.image.getContext('2d');
      const t = makeSprite(fmtCoord(v), '#c084fc', { px: 34 });
      leftCoordLabel.material.map = t.material.map;
      leftCoordLabel.scale.copy(t.scale);
      leftCoordLabel.position.copy(to3dVec(vnum).multiplyScalar(1.05 + 0.18));
    }
  } else {
    leftCoordLabel.visible = false;
  }
}

function setRightBasis(cols) {
  ['i','j','k'].forEach((name, idx) => {
    const c = cols[idx];
    const show = !!c;
    rightArrows[name].visible = show;
    rightLabels[idx].visible = show;
    if (show) {
      const cnum = dimMode ? c.map(q=>q.num) : c;
      const len = Math.hypot(...cnum);
      setArrow(rightArrows[name], cnum, len);
      rightLabels[idx].position.copy(to3dVec(cnum).normalize().multiplyScalar(len + 0.3));
      if (dimMode) {
        // 基向量标单位：取该列向量第 1 个分量的单位作为代表（列向量分量量纲可能不同）
        const q = c[0];
        const ds = q && q.dim ? dimToString(q.dim) : '';
        const t = makeSprite(['î','ĵ','k̂'][idx] + (ds ? '·'+ds : ''), ['#f87171','#4ade80','#60a5fa'][idx], { px: 56 });
        rightLabels[idx].material.map = t.material.map;
        rightLabels[idx].scale.copy(t.scale);
      }
    }
  });
}

function clearRightPath() {
  while (rightPathGroup.children.length) {
    const c = rightPathGroup.children.pop();
    c.geometry.dispose(); c.material.dispose();
  }
  if (rightPurpleArrow) { right.scene.remove(rightPurpleArrow); rightPurpleArrow = null; }
}

function addRightSeg(a, b, t, color) {
  const cur = a.clone().lerp(b, t);
  rightPathGroup.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([a, cur]),
    new THREE.LineBasicMaterial({ color })
  ));
}
function easeInOut(t) { return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2; }

function fitCamera(stage, dim) {
  if (dim === 2) {
    stage.camera.position.set(0.01, 9, 0.01);
    stage.controls.target.set(0, 0, 0);
  } else if (dim === 1) {
    stage.camera.position.set(6, 2, 0.01);
    stage.controls.target.set(1.5, 0, 0);
  } else {
    stage.camera.position.set(8, 6, 10);
    stage.controls.target.set(1.5, 1.5, 1.5);
  }
  stage.camera.lookAt(stage.controls.target);
}

// ============ 动画控制 ============
const statusEl = document.getElementById('status');
let anim = null;
const SEG_DUR = 900;

function applyTransform() {
  if (anim) return;
  const A = parseMatrix(matrixInput.value);
  const v = parseVector(vectorInput.value);
  if (!A) { statusEl.innerHTML = '<b>矩阵解析失败</b><br>请输入 bmatrix 包裹的 m×n 矩阵（m,n ≤ 3）。'; return; }
  const n = A[0].length, m = A.length;
  if (v.length === 0) { statusEl.innerHTML = '<b>向量为空</b>'; return; }
  if (v.length !== n) {
    statusEl.innerHTML = '<b>维度不匹配</b><br>矩阵 A 是 ' + m + '×' + n + '，需要 ' + n + ' 维向量；当前输入是 ' + v.length + ' 维。';
    return;
  }
  const vnum = numArrOf(v);
  if (vnum.every(x => Math.abs(x) < 1e-12)) { statusEl.innerHTML = '<b>零向量</b>'; return; }

  // 量纲模式：校验并算带单位的 A·v
  let Av = matVec(A, v);
  if (dimMode && Av) {
    const err = Av.find(o => o.err);
    if (err) {
      statusEl.innerHTML = '<b>量纲不齐次</b><br>' + err.err + '（量纲齐次性原则：同一分量各乘积项量纲必须一致）。';
      return;
    }
  }

  drawLeft(v);
  fitCamera(left, n);
  fitCamera(right, m);
  clearRightPath();

  const cols = colsOf(A);
  setRightBasis(cols);

  let curPt = to3d(0,0,0);
  const Pts = [curPt.clone()];
  cols.forEach((c, j) => {
    // 数值部分驱动动画
    const cnum = numArrOf(c);
    curPt = curPt.clone().add(to3dVec(cnum.map(x => x * vnum[j])));
    Pts.push(curPt.clone());
  });

  const segs = [];
  for (let j = 0; j < n; j++) {
    if (vnum[j] !== 0) segs.push({ from: Pts[j], to: Pts[j+1], color: STD_COLORS[j], axis: BASIS_NAMES[j], value: vnum[j] });
  }
  anim = { start: performance.now(), segs, P3: Pts[n], Av, vnum };
  statusEl.innerHTML = '<b>阶段 1 / ' + segs.length + '</b><br>从 O 沿新基 ' + segs[0].axis + ' 走 <b>' + segs[0].value + '</b> 个单位 …';
}

function resetView() {
  anim = null;
  const v = parseVector(vectorInput.value);
  drawLeft(v);
  setRightBasis(STD_BASIS);
  clearRightPath();
  rightBall.position.copy(to3d(0,0,0));
  if (rightCoordLabel) rightCoordLabel.visible = false;
  fitCamera(left, v.length || 3);
  fitCamera(right, 3);
  statusEl.innerHTML = '已重置。点击「应用变换」重新演示。';
}

document.getElementById('applyBtn').addEventListener('click', applyTransform);
document.getElementById('resetBtn').addEventListener('click', resetView);

// 初始绘制
drawLeft([2,1,1]);
setRightBasis(STD_BASIS);

// ============ 渲染循环 ============
function loop(now) {
  requestAnimationFrame(loop);
  left.controls.update();
  right.controls.update();

  if (anim) {
    const { segs, P3, Av } = anim;
    const total = segs.length;
    const elapsed = now - anim.start;
    const seg = Math.floor(elapsed / SEG_DUR);
    let t = Math.min(1, Math.max(0, (elapsed % SEG_DUR) / SEG_DUR));
    t = easeInOut(t);

    while (rightPathGroup.children.length) {
      const c = rightPathGroup.children.pop();
      c.geometry.dispose(); c.material.dispose();
    }

    if (seg < total) {
      const s = segs[seg];
      const cur = s.from.clone().lerp(s.to, t);
      for (let i = 0; i < seg; i++) addRightSeg(segs[i].from, segs[i].to, 1, segs[i].color);
      addRightSeg(s.from, s.to, t, s.color);
      statusEl.innerHTML = '<b>阶段 ' + (seg+1) + ' / ' + total + '</b><br>沿新基 <b>' + s.axis + '</b> 走 <b>' + s.value + '</b> 个单位 …';
      rightBall.position.copy(cur);
    } else {
      for (let i = 0; i < total; i++) addRightSeg(segs[i].from, segs[i].to, 1, segs[i].color);
      if (P3.length() > 0.01) {
        const origin = new THREE.Vector3(0,0,0);
        const fullLen = P3.length();
        const dir = P3.clone().sub(origin).normalize();
        rightPurpleArrow = new THREE.ArrowHelper(dir, origin, fullLen, 0xc084fc, 0.25, 0.12);
        right.scene.add(rightPurpleArrow);
        // 量纲模式：A·v 尾部标坐标+单位
        if (dimMode && rightCoordLabel) {
          const t = makeSprite(fmtCoord(Av), '#c084fc', { px: 34 });
          rightCoordLabel.material.map = t.material.map;
          rightCoordLabel.scale.copy(t.scale);
          rightCoordLabel.visible = true;
          rightCoordLabel.position.copy(P3.clone().normalize().multiplyScalar(fullLen + 0.35));
        }
      }
      const avDesc = dimMode
        ? Av.map(x => (+x.num.toFixed(2)) + (dimToString(x.dim) ? ' ' + dimToString(x.dim) : '')).join(', ')
        : Av.map(x=>+x.toFixed(2)).join(', ');
      statusEl.innerHTML = '<b>变换完成</b><br>A·v = (' + avDesc + ')'
        + '<br>映射到 R^' + Av.length;
      anim = null;
    }
  }

  left.renderer.render(left.scene, left.camera);
  right.renderer.render(right.scene, right.camera);
}
requestAnimationFrame(loop);

window.addEventListener('resize', () => {
  [left, right].forEach(s => {
    const w = s.container.clientWidth, h = s.container.clientHeight;
    s.camera.aspect = w/h; s.camera.updateProjectionMatrix();
    s.renderer.setSize(w, h);
  });
});
</script>
<script>
  // highlight current page in drawer
  (function(){
    var page = document.body.getAttribute('data-page');
    if (!page) return;
    document.querySelectorAll('.drawer-link').forEach(function(a){
      if (a.getAttribute('data-page') === page) a.classList.add('active');
    });
  })();
</script>
</body>
